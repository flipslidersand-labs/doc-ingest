[project]
name = "doc-ingest"
version = "0.1.0"
description = "Document ingestion pipeline — external API docs / design docs / arxiv papers → Qdrant"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.10",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
    "click>=8.1",
    "anthropic>=0.30",
    "ruamel.yaml>=0.18",
    "trafilatura>=1.8",
]

[project.scripts]
doc-ingest = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ingest*", "sources*"]

[tool.setuptools.package-dir]
"" = "."

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
