[project]
name = "doc-ingest"
version = "0.1.0"
description = "Document ingestion pipeline — external API docs / design docs / arxiv papers → Qdrant"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
    "click>=8.1",
]

[project.scripts]
doc-ingest = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ingest*", "sources*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
