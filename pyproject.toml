[project]
name = "doc-ingest"
version = "0.1.0"
description = "Document ingestion pipeline — external API docs / design docs / arxiv papers → Qdrant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.10",
    "httpx>=0.27",
    "pymupdf>=1.24,<3.0",
    "tiktoken>=0.7",
    "click>=8.1",
    "anthropic>=0.30",
    "ruamel.yaml>=0.18",
    "trafilatura>=1.8",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/flipslidersand-labs/doc-ingest"

[project.scripts]
doc-ingest = "doc_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["."]
# #346: コードは doc_ingest パッケージ 1 つにまとめる(cli / core / ingest を site-packages の最上位に置かない)
include = ["doc_ingest*"]

[tool.setuptools.package-dir]
"" = "."

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3", "respx>=0.21", "pytest-cov>=5", "ruff>=0.5", "pytest-timeout>=2.3", "pre-commit>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# スレッド内の未処理例外を警告止まりにせず失敗にする (#284)
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.coverage.run]
source = ["doc_ingest"]
omit = ["tests/*"]

[tool.coverage.report]
# Keep in sync with coverage-threshold in .github/workflows/ci.yml (CI's
# --cov-fail-under overrides this value there).
fail_under = 70

[tool.ruff]
line-length = 100
