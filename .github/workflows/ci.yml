name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    uses: flipslidersand-labs/qa-workflows/.github/workflows/python-test.yml@d33890a74113f8ba8d8841a55b290007f72852ef
    with:
      python-version: "3.12"
      # Passed as --cov-fail-under, which overrides pyproject.toml's
      # [tool.coverage.report] fail_under — keep the two in sync.
      coverage-threshold: 70
      pytest-args: "--timeout=60"

  reviewdog:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/reviewdog-python.yml@d33890a74113f8ba8d8841a55b290007f72852ef
