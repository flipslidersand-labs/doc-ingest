name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/python-test.yml@main
    with:
      python-version: "3.12"
      coverage-threshold: 60
      pytest-args: "--timeout=60"

  reviewdog:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/reviewdog-python.yml@main
